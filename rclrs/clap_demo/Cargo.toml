[package]
name = "examples_rclrs_clap_demo"
version = "0.0.1"
authors = ["Antoine Van Malleghem <antoine.vanmalleghem@botronics.be>"]
edition = "2021"

[[bin]]
name = "clap_demo"
path = "src/clap_demo.rs"

[dependencies]
anyhow = {version = "1", features = ["backtrace"]}
rclrs = "0.6"
rosidl_runtime_rs = "0.5"
example_interfaces = "*"

# This specific version is compatible with Rust 1.75
backtrace = "=0.3.74"
